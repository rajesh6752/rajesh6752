name: refresh

# Rebuilds the "Recently active" table in README.md from live GitHub data and
# commits only when it changed.

on:
  schedule:
    - cron: "17 3 * * *" # daily 03:17 UTC; off the hour to avoid the scheduler rush
  workflow_dispatch:

permissions: {}

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  recent:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write # push the refreshed README
      actions: write # keep this schedule alive, see the last step
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Rebuild table
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/update_recent.py

      - name: Commit if changed
        run: |
          if git diff --quiet -- README.md; then
            echo "README.md unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: refresh recently active repositories" -- README.md
          git push

      # GitHub disables scheduled workflows in public repos after 60 days
      # without repository activity. Re-enabling resets that clock, so a quiet
      # month does not silently freeze the table.
      - name: Keep schedule alive
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/refresh.yml/enable"
