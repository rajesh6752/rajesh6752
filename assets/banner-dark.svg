<style>.sans{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif}.mono{font-family:ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace}@keyframes pulse{0%{transform:translateX(0);opacity:0}3%{opacity:1}80%{transform:translateX(410px);opacity:1}84%,100%{transform:translateX(410px);opacity:0}}.pulse{animation:pulse 6s linear infinite}@keyframes progress{0%{transform:scaleX(0);opacity:1}80%,92%{transform:scaleX(1);opacity:1}97%,100%{transform:scaleX(1);opacity:0}}.progress{transform-box:fill-box;transform-origin:0 50%;animation:progress 6s linear infinite}@keyframes status{0%,74.9%{opacity:0}75%,92%{opacity:1}97%,100%{opacity:0}}.status{animation:status 6s linear infinite}@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}.cursor{animation:blink 1.1s steps(1) infinite}@keyframes box0{0%,8.9%{stroke:#30363d;fill-opacity:0}9%,92%{stroke:#4dd2ff;fill-opacity:.12}97%,100%{stroke:#30363d;fill-opacity:0}}@keyframes dot0{0%,8.9%{fill:#8b949e}9%,92%{fill:#3fb950}97%,100%{fill:#8b949e}}.box0{animation:box0 6s linear infinite}.dot0{animation:dot0 6s linear infinite}@keyframes box1{0%,29.6%{stroke:#30363d;fill-opacity:0}29.7%,92%{stroke:#4dd2ff;fill-opacity:.12}97%,100%{stroke:#30363d;fill-opacity:0}}@keyframes dot1{0%,29.6%{fill:#8b949e}29.7%,92%{fill:#3fb950}97%,100%{fill:#8b949e}}.box1{animation:box1 6s linear infinite}.dot1{animation:dot1 6s linear infinite}@keyframes box2{0%,50.2%{stroke:#30363d;fill-opacity:0}50.3%,92%{stroke:#4dd2ff;fill-opacity:.12}97%,100%{stroke:#30363d;fill-opacity:0}}@keyframes dot2{0%,50.2%{fill:#8b949e}50.3%,92%{fill:#3fb950}97%,100%{fill:#8b949e}}.box2{animation:box2 6s linear infinite}.dot2{animation:dot2 6s linear infinite}@keyframes box3{0%,70.9%{stroke:#30363d;fill-opacity:0}71%,92%{stroke:#4dd2ff;fill-opacity:.12}97%,100%{stroke:#30363d;fill-opacity:0}}@keyframes dot3{0%,70.9%{fill:#8b949e}71%,92%{fill:#3fb950}97%,100%{fill:#8b949e}}.box3{animation:box3 6s linear infinite}.dot3{animation:dot3 6s linear infinite}@media (prefers-reduced-motion:reduce){.pulse{display:none}.pulse,.progress,.status,.cursor,[class*=box],[class*=dot]{animation:none}}</style>
