# Source of truth for the generated parts of this profile.
#
#   make assets   re-renders assets/*.svg from this file
#   make check    fails if the committed SVGs no longer match it (CI runs this)
#
# The "Recently active" table in README.md is rebuilt daily by
# .github/workflows/refresh.yml from the public repositories of `login`.

login = "rajesh6752"

[banner]
name = "Rajesh Shukla"
title = "Principal DevOps & CloudOps Engineer"
tagline = "Kubernetes · AWS · Terraform · GitOps · Automation & AI"
prompt = "$ whoami"
# One stage per "How I work" principle in README.md.
stages = ["plan", "build", "ship", "operate"]

[recent]
limit = 5
# Repositories not pushed to for longer than this drop out of the table.
max_age_days = 540
# Never listed, even when recently pushed.
exclude = [
  "rajesh6752",
  "Thanos",
  "tf-examples",
  "Kubefiles",
  "covidtracker",
  "corona-traiker",
  "haikus-for-codespaces",
  "portfolio",
]

# Toolbelt rows, top to bottom. `icon` is a key in assets/icons.json;
# items without one get a neutral hexagon so the rhythm of the row holds.
[[toolbelt]]
label = "Cloud"
items = [
  { name = "AWS" },
  { name = "Azure" },
  { name = "Google Cloud", icon = "googlecloud" },
]

[[toolbelt]]
label = "Platform"
items = [
  { name = "Kubernetes", icon = "kubernetes" },
